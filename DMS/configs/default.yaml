# 默认超参
survival:
  v_new: 1.0
  t_base: 30.0
  mu: 15.0
  beta: 0.5
  gamma: 1.0

capacity:
  C_min: 70
  C_max: 100
  delta_step: 10

retrieval:
  top_k: 1
  # 对齐常用 DMS 调用：子任务 Goal 双因子乘积门槛
  min_score: 0.95

agent:
  max_planner_steps: 5
  max_codeact_turns: 8

embedding:
  model_name_or_path: BAAI/bge-small-en-v1.5
  device: cpu
  normalize: true

mutation:
  epsilon: 0.1

risk:
  m: 4.0
  t_global_init: 0.3
  lambda_pen: 0.3
  tau_base: 0.55

storage:
  root: memory_banks/dms
  db_name: index.sqlite
  traj_dirname: traj

vlm:
  # OpenRouter: export OPENROUTER_API_KEY=sk-or-...
  # OpenAI:     export OPENAI_API_KEY=sk-... && export VLM_PROVIDER=openai
  provider_env: VLM_PROVIDER
  api_key_envs: [OPENROUTER_API_KEY, OPENAI_API_KEY, QWEN_API_KEY, DASHSCOPE_API_KEY]
  openrouter_model: qwen/qwen3-vl-8b-instruct
  openai_model: gpt-4o
  dashscope_model: qwen3-vl-8b-instruct
